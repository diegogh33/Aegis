version: 1

scan:

  # Ventana de vencimientos a explorar al escanear la cadena de
  # opciones, ANTES de aplicar la Constitution. Deliberadamente más
  # ancha que cash_secured_put.dte (30-45): permite ver candidatos
  # algo más lejanos (hasta max) si la ventana estricta de la
  # Constitution no trae nada interesante, sin gastar peticiones de
  # mercado en vencimientos demasiado cortos (poca prima, casi no
  # merece la pena) por debajo de min.
  dte_window:
    min: 25
    max: 55

  # Cuántos strikes traer por cada vencimiento dentro de la ventana,
  # priorizando los más cercanos al precio actual del subyacente
  # (los relevantes para vender PUT con delta objetivo). Con
  # subyacentes muy líquidos (ej. MSFT) un vencimiento puede tener
  # decenas de strikes; sin este límite, cada vencimiento adicional
  # multiplicaría las peticiones de market data.
  strikes_per_expiration: 8

cash_secured_put:

  delta:

    preferred:
      min: -0.25
      max: -0.15

    warning:
      min: -0.35

  earnings:

    minimum_days: 14

  dte:

    min: 30
    max: 45

  liquidity:

    minimum_open_interest: 500
    minimum_volume: 50

  spread:

    maximum_percent: 5

  premium:

    minimum_annualized_return: 12

  ivr:

    # Umbrales reales del sistema de venta de primas de Diego
    # (Sistema_Venta_Prima.md): IVR >= 30 aceptable, preferiblemente
    # >= 40.
    minimum: 30
    preferred_minimum: 40

    # Ventana de histórico sobre la que se calcula el rank (días).
    lookback_days: 365

    # Días mínimos de historial acumulado antes de que IVRankRule
    # empiece a bloquear de verdad. Por debajo de esto, la regla pasa
    # sin bloquear (no hay suficiente señal para confiar en el
    # cálculo) - 90 días es un punto intermedio: cubre al menos un
    # ciclo trimestral de earnings sin retrasar la utilidad de la
    # regla tanto como exigir medio año o un año completo.
    minimum_days_history: 90

  scoring:

    delta:
      target: 0.20
      weight: 30

    spread:
      weight: 15
      max_percentage: 0.20

    volume:
      weight: 10
      normalization: 100

    annualized_return:
      weight: 45
      target: 15

long_term_put:

  # Estrategia oportunista, distinta de la venta de primas recurrente
  # (cash_secured_put): se activa manualmente con --long-term, para
  # convicción alta en caídas puntuales (ej. ACN a $135, strike $120,
  # vencimiento a ~4 meses) — no forma parte del análisis por defecto.

  delta:

    preferred:
      min: -0.30
      max: -0.10

    warning:
      min: -0.35

  dte:

    min: 90
    max: 365

  # Ventana de escaneo de vencimientos (distinta de scan.dte_window,
  # pensada para la ventana corta de la estrategia recurrente).
  scan_dte_window:
    min: 90
    max: 365

  # Spreads estructuralmente más anchos en opciones de largo plazo
  # (confirmado con NFLX: el único candidato que pasó el 5% del CSP
  # recurrente era el de jun-2027, mientras strikes con delta correcto
  # en vencimientos de dic-2026 y mar-2027 tenían spreads de 6-8%).
  spread:
    maximum_percent: 10

  # Volumen más bajo aceptable: las opciones de 90-365 días tienen
  # mucho menos volumen diario que las de 30-45 días, pero el
  # open interest suele ser alto (posiciones acumuladas a largo plazo).
  liquidity:
    minimum_volume: 0
    minimum_open_interest: 100
watchlist:

  # Tickers excluidos del watchlist automático (sin argumentos).
  # Útil para acciones estables con primas bajas que no merecen
  # el tiempo de análisis (ej. PG, DEO), o ADRs sin mercado de
  # opciones (ej. KRKNF), o tickers europeos que dan error
  # sistemático (ej. MC.PA, WKL, LOG.MC).
  # No aplica cuando se pasan tickers explícitamente.
  exclude:
    - KRKNF
    - MC.PA
    - WKL
    - LOG.MC
    - PG
    - DEO
    - MAIN

