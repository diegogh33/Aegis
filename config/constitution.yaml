version: 1

scan:

  # Ventana de vencimientos a explorar al escanear la cadena de
  # opciones, ANTES de aplicar la Constitution. Deliberadamente más
  # ancha que cash_secured_put.dte (30-45): permite ver candidatos
  # algo más lejanos (hasta max) si la ventana estricta de la
  # Constitution no trae nada interesante, sin gastar peticiones de
  # mercado en vencimientos demasiado cortos (poca prima, casi no
  # merece la pena) por debajo de min.
  dte_window:
    min: 25
    max: 55

  # Cuántos strikes traer por cada vencimiento dentro de la ventana,
  # priorizando los más cercanos al precio actual del subyacente
  # (los relevantes para vender PUT con delta objetivo). Con
  # subyacentes muy líquidos (ej. MSFT) un vencimiento puede tener
  # decenas de strikes; sin este límite, cada vencimiento adicional
  # multiplicaría las peticiones de market data.
  strikes_per_expiration: 8

cash_secured_put:

  delta:

    preferred:
      min: -0.25
      max: -0.15

    warning:
      min: -0.35

  earnings:

    minimum_days: 14

  dte:

    min: 30
    max: 45

  liquidity:

    minimum_open_interest: 500
    minimum_volume: 50

  spread:

    maximum_percent: 5

  premium:

    minimum_annualized_return: 12

  ivr:

    # Umbrales reales del sistema de venta de primas de Diego
    # (Sistema_Venta_Prima.md): IVR >= 30 aceptable, preferiblemente
    # >= 40.
    minimum: 30
    preferred_minimum: 40

    # Ventana de histórico sobre la que se calcula el rank (días).
    lookback_days: 365

    # Días mínimos de historial acumulado antes de que IVRankRule
    # empiece a bloquear de verdad. Por debajo de esto, la regla pasa
    # sin bloquear (no hay suficiente señal para confiar en el
    # cálculo) - 90 días es un punto intermedio: cubre al menos un
    # ciclo trimestral de earnings sin retrasar la utilidad de la
    # regla tanto como exigir medio año o un año completo.
    minimum_days_history: 90

  scoring:

    delta:
      target: 0.20
      weight: 30

    spread:
      weight: 15
      max_percentage: 0.20

    volume:
      weight: 10
      normalization: 100

    annualized_return:
      weight: 45
      target: 15