version: 1

scan:

  # Ventana de vencimientos a explorar al escanear la cadena de
  # opciones, ANTES de aplicar la Constitution. Deliberadamente más
  # ancha que cash_secured_put.dte (30-45): permite ver candidatos
  # algo más lejanos (hasta max) si la ventana estricta de la
  # Constitution no trae nada interesante, sin gastar peticiones de
  # mercado en vencimientos demasiado cortos (poca prima, casi no
  # merece la pena) por debajo de min.
  dte_window:
    min: 20
    max: 60

cash_secured_put:

  delta:

    preferred:
      min: -0.25
      max: -0.15

    warning:
      min: -0.35

  earnings:

    minimum_days: 14

  dte:

    min: 30
    max: 45

  liquidity:

    minimum_open_interest: 500
    minimum_volume: 50

  spread:

    maximum_percent: 5

  premium:

    minimum_annualized_return: 12

  scoring:

    delta:
      target: 0.20
      weight: 30

    spread:
      weight: 15
      max_percentage: 0.20

    volume:
      weight: 10
      normalization: 100

    annualized_return:
      weight: 45
      target: 15