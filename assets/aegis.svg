  <line x1="70" y1="190" x2="68" y2="205" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>
  <line x1="85" y1="197" x2="84" y2="210" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>
  <line x1="100" y1="200" x2="100" y2="213" stroke="#c9a84c" stroke-width="1.5" opacity="0.6"/>
