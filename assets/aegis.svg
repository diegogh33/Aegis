  <!-- Snake hair (simplified) -->
  <path d="M70 95 Q65 80 75 72 Q80 68 85 75" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
  <path d="M88 85 Q85 70 95 65" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
  <path d="M112 85 Q115 70 105 65" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
  <path d="M130 95 Q135 80 125 72 Q120 68 115 75" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.7"/>
