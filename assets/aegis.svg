  <ellipse cx="89" cy="110" rx="6" ry="7" fill="#c9a84c" opacity="0.9"/>
  <ellipse cx="111" cy="110" rx="6" ry="7" fill="#c9a84c" opacity="0.9"/>
  <circle cx="89" cy="111" r="3" fill="#1a1a2e"/>
